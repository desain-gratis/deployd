<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deployd Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-200">

  <!-- Top Bar -->
  <div class="bg-slate-800 border-b border-slate-700">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg md:text-xl font-semibold text-white">Deployd Console</h1>
      <button onclick="landing()" class="text-xs md:text-sm text-slate-400 hover:text-white">Home</button>
    </div>
  </div>

  <div id="app" class="max-w-6xl mx-auto p-4 md:p-6"></div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-3">
    <div
      class="bg-slate-800 w-full md:w-5/6 max-h-[90vh] rounded-xl shadow-2xl overflow-hidden flex flex-col border border-slate-700">
      <div class="flex justify-between items-center px-4 py-3 border-b border-slate-700">
        <h2 id="modal-title" class="text-base md:text-lg font-semibold"></h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-red-400 text-xl">✕</button>
      </div>
      <div id="modal-body" class="p-4 overflow-auto text-xs md:text-sm"></div>
    </div>
  </div>

  <script>
    const API = "http://localhost:9401";
    const headers = { "X-Namespace": "*" };

    let buildPoller = null;
    let lastRepoId = null;

    document.getElementById('modal').addEventListener('click', function (e) {
      if (e.target === this) {
        closeModal();
      }
    });

    function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
    function setPage(content) { document.getElementById('app').innerHTML = ''; document.getElementById('app').appendChild(content); }

    function backBtn(fn) {
      return `<button onclick="${fn}" class="text-xs md:text-sm text-slate-400 hover:text-white mb-4">← Back</button>`;
    }

    function card(title, body, onclick = "") {
      return `
    <div onclick="${onclick}" class="bg-slate-800 border border-slate-700 rounded-xl p-4 md:p-6 cursor-pointer hover:border-slate-500 transition">
      <h3 class="font-semibold text-white mb-1">${title}</h3>
      <div class="text-xs md:text-sm text-slate-400">${body}</div>
    </div>`;
    }

    function primaryBtn(label, color, onclick) {
      return `<button onclick='${onclick}'
    class="px-3 py-2 text-xs md:text-sm rounded-lg text-white shadow ${color} hover:opacity-90 transition">
    ${label}
  </button>`;
    }

    /* ---------------- Modal Helpers ---------------- */

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modal').classList.remove('flex');
      if (buildPoller) {
        clearInterval(buildPoller);
        buildPoller = null;
      }
    }

    /* -------- Key / Value Table -------- */

    function showKeyValueTable(title, wrapper) {
      const value = (wrapper && wrapper[0] && wrapper[0].value) || {};

      const rows = Object.entries(value).map(([k, v]) => `
    <tr class="border-b border-slate-700">
      <td class="p-2 font-mono text-blue-400 break-all">${k}</td>
      <td class="p-2 break-all">${v}</td>
    </tr>
  `).join("");

      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-body').innerHTML = `
    <div class="overflow-auto">
      <table class="min-w-[600px] w-full text-left border border-slate-700">
        <thead class="bg-slate-800 text-slate-400">
          <tr>
            <th class="p-2 w-1/3">Key</th>
            <th class="p-2">Value</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;

      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    /* ---------------- Build Table ---------------- */

    function showBuildTable(builds) {
      const rows = builds.map(b => {
        const shortCommit = b.commit_id.slice(0, 7);
        const time = new Date(b.published_at).toLocaleString();
        const osarch = (b.os_arch || []).join(", ");

        const archiveLinks = (b.archive || []).map(a =>
          `<a href="${a.url}" target="_blank" class="text-blue-400 underline">${a.id}</a>`
        ).join("<br>");

        return `
      <tr class="border-b border-slate-700">
        <td class="p-2">${b.id}</td>
        <td class="p-2">${time}</td>
        <td class="p-2">${b.branch || '-'}</td>
        <td class="p-2 font-mono text-blue-400">${shortCommit}</td>
        <td class="p-2">${b.actor}</td>
        <td class="p-2">${osarch}</td>
        <td class="p-2">${archiveLinks}</td>
        <td class="p-2">
          <button onclick='showBuildDetail(${JSON.stringify(b)})'
            class="text-xs bg-slate-600 px-2 py-1 rounded">Detail</button>
        </td>
      </tr>
    `;
      }).join("");

      document.getElementById('modal-title').innerText = "Build History";
      document.getElementById('modal-body').innerHTML = `
    <div class="overflow-auto">
      <table class="min-w-[900px] w-full text-left text-xs md:text-sm border border-slate-700">
        <thead class="bg-slate-800 text-slate-400">
          <tr>
            <th class="p-2">ID</th>
            <th class="p-2">Time</th>
            <th class="p-2">Branch</th>
            <th class="p-2">Commit</th>
            <th class="p-2">Actor</th>
            <th class="p-2">OS/Arch</th>
            <th class="p-2">Archive</th>
            <th class="p-2">Details</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');

      if (!buildPoller && lastRepoId) {
        buildPoller = setInterval(async () => {
          const latest = await api('/artifactd/build?repository=' + lastRepoId);
          showBuildTable(latest);
        }, 10000);
      }
    }

    function showBuildDetail(b) {
      document.getElementById('modal-title').innerText = `Build ${b.id}`;
      document.getElementById('modal-body').innerHTML =
        `<pre class="bg-slate-900 p-3 rounded overflow-auto">${JSON.stringify(b, null, 2)}</pre>`;
    }

    /* ---------------- Landing ---------------- */

    function landing() {
      setPage(el(`
    <div class="grid gap-4 md:grid-cols-3">
      ${card("Host Information", "List all registered hosts", "hostPage()")}
      ${card("Artifact Repository", "Repositories, builds and archives", "repoPage()")}
      ${card("Service List", "Services and runtime configuration", "servicePage()")}
    </div>
  `));
    }

    /* ---------------- Hosts ---------------- */

    async function hostPage() {
      const data = await api('/deployd/host');

      const rows = data.map(h => `
    <div onclick='showHostDetail(${JSON.stringify(h)})'
      class="bg-slate-800 border border-slate-700 rounded-lg p-4 cursor-pointer hover:border-slate-500">
      <div class="font-semibold text-white">${h.host}</div>
      <div class="text-xs text-slate-400">${h.os}/${h.architecture} • ${h.fqdn}</div>
    </div>`).join("");

      setPage(el(`
    <div>
      ${backBtn('landing()')}
      <h2 class="text-xl md:text-2xl font-semibold mb-4">Hosts</h2>
      <div class="space-y-3">${rows}</div>
    </div>
  `));
    }

    function showHostDetail(h) {
      document.getElementById('modal-title').innerText = `Host: ${h.host}`;
      document.getElementById('modal-body').innerHTML = `
    <div class="space-y-2 text-sm">
      <div><b>Namespace:</b> ${h.namespace}</div>
      <div><b>FQDN:</b> ${h.fqdn}</div>
      <div><b>OS / Arch:</b> ${h.os} / ${h.architecture}</div>
      <div><b>Replica ID:</b> ${h.raft_config.replica_id}</div>
      <div><b>Published At:</b> ${new Date(h.published_at).toLocaleString()}</div>
    </div>`;
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }

    /* ---------------- Repository ---------------- */

    async function repoPage() {
      const data = await api('/artifactd/repository');

      const cards = data.map(r =>
        card(r.name, `ID: ${r.id}<br>Namespace: ${r.namespace}`, `repoDetail('${r.id}')`)
      ).join("");

      setPage(el(`
    <div>
      ${backBtn('landing()')}
      <h2 class="text-xl md:text-2xl font-semibold mb-4">Repositories</h2>
      <div class="grid gap-4">${cards}</div>
    </div>
  `));
    }

    async function repoDetail(id) {
      lastRepoId = id;
      const builds = await api('/artifactd/build?repository=' + id);

      setPage(el(`
    <div>
      ${backBtn('repoPage()')}
      <h2 class="text-xl md:text-2xl font-semibold mb-6">Repository: ${id}</h2>
      ${primaryBtn("View Builds", "bg-blue-600", `showBuildTable(${JSON.stringify(builds)})`)}
    </div>
  `));
    }

    /* ---------------- Services ---------------- */

    async function servicePage() {
      const data = await api('/deployd/service');

      const cards = data.map(s =>
        card(s.name, `ID: ${s.id}<br>Namespace: ${s.namespace}`, `serviceDetail('${s.id}')`)
      ).join("");

      setPage(el(`
    <div>
      ${backBtn('landing()')}
      <h2 class="text-xl md:text-2xl font-semibold mb-4">Services</h2>
      <div class="grid gap-4">${cards}</div>
    </div>
  `));
    }

    async function serviceDetail(id) {
      const env = await api('/secretd/env?service=' + id);
      const secret = await api('/secretd/secret?service=' + id);
      const jobsWrapper = await api('/deployd/successful-job');
      const jobs = jobsWrapper || [];

      // find first successful job for this service
      const job = jobs.find(j =>
        j.request &&
        j.request.service &&
        j.request.service.id === id
      );

      let deploymentSection = `
    <div class="mt-6 text-sm text-slate-500">
      No successful deployment found.
    </div>
  `;

      if (job) {
        const status = job.status;
        const date = new Date(job.published_at).toLocaleString();
        const confirmed = job.deployment?.confirmed_by || "-";
        const hostStatus = job.deployment?.status || {};

        const hostRows = Object.entries(hostStatus).map(([host, data]) => `
      <tr class="border-b border-slate-700">
        <td class="p-2">${host}</td>
        <td class="p-2 font-semibold ${data.status === "SUCCESS" ? "text-green-400" : "text-red-400"
          }">${data.status}</td>
      </tr>
    `).join("");

        deploymentSection = `
      <div class="mt-8">
        <h3 class="text-lg font-semibold mb-3">Latest Successful Deployment</h3>

        <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 space-y-2 text-sm">
          <div>
            Status:
            <span class="font-semibold ${status === "DEPLOYED" ? "text-green-400" : "text-yellow-400"
          }">${status}</span>
          </div>

          <div>Job Date: ${date}</div>
          <div>Confirmed By: ${confirmed}</div>
          <div>Target Hosts: ${Object.keys(hostStatus).length}</div>

          <div class="mt-3 overflow-auto">
            <table class="min-w-[400px] w-full text-left border border-slate-700">
              <thead class="bg-slate-900 text-slate-400">
                <tr>
                  <th class="p-2">Host</th>
                  <th class="p-2">Deploy Status</th>
                </tr>
              </thead>
              <tbody>
                ${hostRows}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
      }

      setPage(el(`
    <div>
      ${backBtn('servicePage()')}
      <h2 class="text-xl md:text-2xl font-semibold mb-6">Service: ${id}</h2>

      <div class="flex gap-3 flex-wrap">
        ${primaryBtn("View Env", "bg-green-600", `showKeyValueTable("Environment Variables", ${JSON.stringify(env)})`)}
        ${primaryBtn("View Secrets", "bg-red-600", `showKeyValueTable("Secrets", ${JSON.stringify(secret)})`)}
        ${primaryBtn("New Deployment", "bg-blue-600", `openDeploymentForm("${id}")`)}
      </div>
      ${deploymentSection}
    </div>
  `));
    }
    async function openDeploymentForm(serviceId) {

      const servicesWrapper = await api('/deployd/service');
      const serviceDef = (servicesWrapper || []).find(s => s.id === serviceId);

      if (!serviceDef || !serviceDef.repository) {
        alert("Service repository not defined.");
        return;
      }

      const repo = serviceDef.repository;
      const repoId = repo.id;
      const repoNamespace = repo.namespace;

      // Fetch builds
      const builds = await api('/artifactd/build?repository=' + repoId) || [];

      // Fetch successful deployments (to know actor + date)
      const jobs = await api('/deployd/successful-job') || [];

      // Map release_version → job info
      const deploymentMap = {};
      jobs.forEach(job => {
        const release = job?.request?.release_version;
        if (release) {
          deploymentMap[release] = {
            actor: job?.request?.actor || job?.actor || "unknown",
            date: job?.finished_at || job?.created_at || "-"
          };
        }
      });

      // Sort builds newest first
      builds.sort((a, b) => Number(b.id) - Number(a.id));

      const releaseOptions = builds.map((b, index) => {

        const shortCommit = b.commit_id
          ? b.commit_id.substring(0, 7)
          : "-";

        const branch = b.branch || "-";
        const version = b.version || "-";

        const deployInfo = deploymentMap[b.id] || {};
        const actor = deployInfo.actor || "—";
        const deployDate = deployInfo.date
          ? new Date(deployInfo.date).toLocaleString()
          : "—";

        return `
      <option value="${b.id}" ${index === 0 ? "selected" : ""}>
        Build ${b.id} ${index === 0 ? "(LATEST)" : ""}
        | Commit: ${shortCommit}
        | Repo: ${repoNamespace}/${repoId}
        | Branch: ${branch}
        | Version: ${version}
        | Actor: ${actor}
        | Deployed: ${deployDate}
      </option>
    `;
      }).join("");

      // Fetch env & secret
      const envWrapper = await api('/secretd/env?service=' + serviceId) || [];
      const secretWrapper = await api('/secretd/secret?service=' + serviceId) || [];

      const latestJob = jobs.find(j =>
        j.request &&
        j.request.service &&
        j.request.service.id === serviceId
      );

      let targetHosts = [];

      if (latestJob?.request?.target_hosts?.length > 0) {
        targetHosts = latestJob.request.target_hosts;
      } else {
        const hostWrapper = await api('/deployd/host') || [];
        hostWrapper.sort((a, b) => a.host.localeCompare(b.host));
        targetHosts = hostWrapper.map((h, index) => ({
          host: h.host,
          raft_config: {
            replica_id: index + 1,
            wal_dir: "/data",
            node_host_dir: "/data"
          }
        }));
      }

      const lastEnvVersion = latestJob?.request?.env_version ?? -1;
      const lastSecretVersion = latestJob?.request?.secret_version ?? -1;

      function buildOptions(list, lastVersion) {
        return list.map(item => {
          const isNew = item.version > lastVersion;
          return `
        <option value="${item.version}">
          v${item.version}${isNew ? " (NEW)" : ""}
        </option>
      `;
        }).join("");
      }

      document.getElementById('modal-title').innerText = "New Deployment";

      document.getElementById('modal-body').innerHTML = `
    <div class="space-y-4 text-sm">

      <div>
        <label class="block mb-1 font-semibold">Release Version</label>
        <select id="release_version"
          class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs">
          ${releaseOptions}
        </select>
      </div>

      <div>
        <label class="block mb-1">Env Version</label>
        <select id="env_version"
          class="w-full bg-slate-900 border border-slate-700 rounded p-2">
          ${buildOptions(envWrapper, lastEnvVersion)}
        </select>
      </div>

      <div>
        <label class="block mb-1">Secret Version</label>
        <select id="secret_version"
          class="w-full bg-slate-900 border border-slate-700 rounded p-2">
          ${buildOptions(secretWrapper, lastSecretVersion)}
        </select>
      </div>

      <div>
        <label class="block mb-1">Timeout Seconds</label>
        <input id="timeout_seconds" type="number" value="900"
          class="w-full bg-slate-900 border border-slate-700 rounded p-2"/>
      </div>

      <div>
        <div class="font-semibold mb-2">
          Target Hosts ${latestJob ? "(from last deployment)" : "(first deployment auto-generated)"}
        </div>
        <div class="bg-slate-900 border border-slate-700 rounded p-2 text-xs font-mono overflow-auto">
${JSON.stringify(targetHosts, null, 2)}
        </div>
      </div>

      <div class="flex justify-end mt-6">
        <button onclick='submitDeployment("${serviceId}", ${JSON.stringify(targetHosts)})'
          class="bg-blue-600 px-4 py-2 rounded text-white hover:opacity-90">
          Submit Deployment
        </button>
      </div>

    </div>
  `;

      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modal').classList.add('flex');
    }


    async function submitDeployment(serviceId, targetHosts) {

      const selectedBuildVersion = Number(
        document.getElementById('release_version').value
      );

      const selectedSecretVersion = Number(
        document.getElementById('secret_version').value
      );

      const selectedEnvVersion = Number(
        document.getElementById('env_version').value
      );

      const timeoutSeconds = Number(
        document.getElementById('timeout_seconds').value
      );

      const payload = {
        namespace: "deployd",
        service: {
          id: serviceId
        },

        // 🔥 FIX HERE
        build_version: selectedBuildVersion,

        secret_version: selectedSecretVersion,
        env_version: selectedEnvVersion,

        raft_config_version: 0,
        raft_config_replica_version: 0,
        target_hosts: targetHosts,
        timeout_seconds: timeoutSeconds,
        is_believe: true
      };

      console.log("Deployment Payload:", payload);

      await fetch(API + "/deployd/submit-job", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Namespace": "*"
        },
        body: JSON.stringify(payload)
      });

      closeModal();
      alert("Deployment requested successfully.");
    }




    /* ---------------- API ---------------- */

    async function api(path) {
      const r = await fetch(API + path, { headers });
      return (await r.json()).success;
    }

    landing();
  </script>
</body>

</html>
