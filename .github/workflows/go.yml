name: Build & Deploy Go App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Hello"
        required: true
        default: "staging"

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      draft_tag: ${{ steps.draft_tag.outputs.draft_tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Test
        run: go test -v ./...

      - name: Build deployd and copy necessary files
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/user-profile -v ./cmd/test/user-profile/*.go
          chmod u+x dist/user-profile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployd-archive
          path: dist/
          if-no-files-found: error
